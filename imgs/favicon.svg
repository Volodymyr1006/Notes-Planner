<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17171d"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b79bff"/>
      <stop offset="100%" stop-color="#7c5cf5"/>
    </linearGradient>
    <pattern id="hatchA" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1"/>
    </pattern>
    <pattern id="hatchB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="peaksClip">
      <path d="M6,84 L25,18 L37.5,45 L50,18 L62.5,45 L80,18 L94,84 L70,80 L50,83 L30,80 Z"/>
    </clipPath>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- badge (scaled down slightly, centered, so the icon reads smaller at favicon size) -->
  <g transform="translate(4.5,4.5) scale(0.91)">
    <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#badgeGrad)"/>
    <rect x="2.5" y="2.5" width="95" height="95" rx="23.5" fill="none" stroke="#3a2f66" stroke-width="1"/>

    <!-- ambient glow behind the mountain mark -->
    <path d="M6,84 L25,18 L37.5,45 L50,18 L62.5,45 L80,18 L94,84 Z" fill="#8b6bff" opacity="0.4" filter="url(#softGlow)"/>

    <!-- mountain mark with woven texture, clipped to silhouette -->
    <g clip-path="url(#peaksClip)">
      <path d="M6,84 L25,18 L37.5,45 L50,18 L62.5,45 L80,18 L94,84 L70,80 L50,83 L30,80 Z" fill="url(#peakGrad)"/>
      <rect x="0" y="0" width="100" height="100" fill="url(#hatchA)"/>
      <rect x="0" y="0" width="100" height="100" fill="url(#hatchB)"/>
    </g>

    <!-- summit notches (signature detail from the original mark) -->
    <path d="M22.3,18 L25,28 L27.7,18 Z" fill="url(#badgeGrad)"/>
    <path d="M47.3,18 L50,28 L52.7,18 Z" fill="url(#badgeGrad)"/>
    <path d="M77.3,18 L80,28 L82.7,18 Z" fill="url(#badgeGrad)"/>
  </g>
</svg>
