<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Notes Planner — особистий застосунок для нотаток і планування подій у календарі.">

    <title>Вхід</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="/imgs/favicon.svg">
</head>
<body>

 <main>
 <img class="top-logo" src="/imgs/logo.svg" alt="Notes Planner">
 <p class="tagline">Твій особистий помічник</p>
 <h1>Увійти в акаунт Notes</h1>
 <form novalidate>

  <div class="input-wrap">
   <label for="email-input">Email</label>
   <div class="field">
    <input type="email" id="email-input" placeholder="Твій email">
    <button type="button" class="clear-email" id="clear-email" aria-label="Змінити email">✕</button>
   </div>
   <p class="error-text" role="alert">Будь ласка, введіть вашу email адресу</p>
  </div>
  <p class="helper-text">Ми надішлемо код підтвердження на цю адресу</p>
  <div class="code-wrap" id="code-wrap">
   <div class="input-wrap">
    <label for="code-input">Код підтвердження</label>
    <input type="text" id="code-input" placeholder="Введи код">
    <p class="error-text" id="code-error" role="alert">Невірний код, спробуй ще раз</p>
   </div>
   <p class="helper-text">Ми надіслали код на твою пошту</p>
   <button type="button" class="resend-btn" id="resend-btn" disabled>Надіслати повторно (30с)</button>
  </div>
  <button type="submit">Продовжити</button>
 </form>
 
 <div class="lang-switch">
  <button type="button" class="lang-toggle" aria-haspopup="listbox" aria-expanded="false">🌐 UA <span class="chevron">▾</span></button>
  <ul class="lang-menu">
   <li>
    <span class="lang-name">English (EN)</span>
    <span class="lang-sub">English</span>
   </li>
   <li>
    <span class="lang-name">Українська (UA)</span>
    <span class="lang-sub">Ukrainian</span>
   </li>
  </ul>
 </div>
 </main>

 <script src="/js/script.js"></script>
</body>
</html>
