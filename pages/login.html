<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Notes Planner — особистий застосунок для нотаток і планування подій у календарі.">
<title>Вхід — Notes Planner</title>
<link rel="icon" href="/imgs/favicon-white.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/login.css">
<script>
  // TEMPORARY: "remember me" is just a client-side timestamp in localStorage for now —
  // there is no real backend session yet (see server/server.js). Anyone can bypass this
  // by editing localStorage. Replace with a real server-side session once accounts +
  // SQLite exist (see PROJECT_STATUS.md plan items 1-2).
  (function () {
    var until = Number(localStorage.getItem('notaRememberedUntil'));
    if (until && Date.now() < until) window.location.href = '/dashboard';
  })();
</script>
</head>
<body>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<main class="auth-shell">
  <div class="auth-card">
    <a href="/" class="back-link"><svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> Назад</a>
    <a href="/" class="top-logo"><img src="/imgs/logo-white.svg" alt="Notes Planner"></a>
    <p class="tagline">Твій особистий помічник</p>
    <h1>Увійти в акаунт</h1>

    <form novalidate id="loginForm">

      <div class="input-wrap" id="name-wrap">
        <label for="name-input">Ім'я користувача</label>
        <div class="field">
          <input type="text" id="name-input" placeholder="Як до тебе звертатись?" autocomplete="off">
          <button type="button" class="clear-email" id="clear-name" aria-label="Очистити ім'я">
            <svg class="icon icon-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <p class="error-text" role="alert">Введи ім'я користувача</p>
      </div>

      <div class="input-wrap">
        <label for="email-input">Email</label>
        <div class="field">
          <input type="email" id="email-input" placeholder="Твій email" autocomplete="email">
          <button type="button" class="clear-email" id="clear-email" aria-label="Змінити email">
            <svg class="icon icon-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <p class="error-text" role="alert">Будь ласка, введіть вашу email адресу</p>
      </div>

      <label class="remember-row" for="remember-me">
        <input type="checkbox" id="remember-me">
        <span class="checkbox-box"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg></span>
        Запам'ятати мене
      </label>

      <p class="helper-text">Ми надішлемо код підтвердження на цю адресу</p>

      <div class="code-wrap" id="code-wrap">
        <div class="code-wrap-inner">
          <div class="input-wrap">
            <label for="code-input">Код підтвердження</label>
            <input type="text" id="code-input" placeholder="Введи код" inputmode="numeric" autocomplete="one-time-code">
            <p class="error-text" role="alert">Невірний код, спробуй ще раз</p>
          </div>
          <p class="helper-text">Ми надіслали код на твою пошту</p>
          <button type="button" class="resend-btn" id="resend-btn" disabled>Надіслати повторно (30с)</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Створити акаунт</button>
    </form>

    <div class="lang-segment" id="langSegment" role="group" aria-label="Мова інтерфейсу">
      <span class="lang-seg-indicator" id="langSegIndicator" aria-hidden="true"></span>
      <button type="button" class="lang-seg-btn active" data-lang="ua" aria-pressed="true">UA</button>
      <button type="button" class="lang-seg-btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</main>

<div class="toast" id="toast">
  <span class="tick">✓</span>
  <span id="toastMsg">Код надіслано</span>
</div>

<script src="/js/script.js"></script>
</body>
</html>
