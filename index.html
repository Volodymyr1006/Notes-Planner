<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вхід</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imgs/favicon.svg">
</head>
<body>

 <img class="top-logo" src="imgs/logo.svg" alt="Notes Planner">
 <p class="tagline">Твій особистий помічник</p>
 <h1>Увійти в акаунт Notes</h1>
 <form novalidate>

  <div class="input-wrap">
   <input type="email" id="email-input" placeholder="Твій email">
   <p class="error-text">Будь ласка, введіть вашу email адресу</p>
  </div>
  <p class="helper-text">Ми надішлемо код підтвердження на цю адресу</p>
  <button type="submit">Продовжити</button>
 </form>
 <div class="lang-switch">
  <button type="button" class="lang-toggle">🌐 UA <span class="chevron">▾</span></button>
  <ul class="lang-menu">
   <li>English (US)</li>
   <li>UKraine (UA)</li>
  </ul>
 </div>

 <script src="script.js"></script>
</body>
</html>
